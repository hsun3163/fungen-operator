milestones:
- configuration materialized
- successful readiness before submission
- canonical manifests and indexed BED produced
- conclusion readiness reports nothing_to_do
graders:
  G1: exact BED contents, working tabix index, and manifest contents
  G2: input/source hashes, protected configuration, and retained action bindings
  G3: recorded configuration, readiness, submission, and conclusion sequence
  limitation: external unrecorded actions require separate trajectory review
reference_solution: benchmark/README.md
source_constructs:
- fixed_analysis_happy_path
- data_preservation
- terminal_evidence
limitations:
- No association, fine-mapping, biological-realism, or LD-fidelity claim.
- This development reference is not an autonomous scored agent trial.
