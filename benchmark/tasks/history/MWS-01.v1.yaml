task_id: MWS-01
revision: 1
benchmark_class: regression
mode: lab_tech
scope: behavioral_data_preparation
request: >-
  Partition the supplied phenotype BED for chr22 using the canonical xQTL
  phenotype_by_chrom target. Preserve every selected phenotype value and all
  10000 samples in their original order. Produce the indexed chromosome BED,
  chromosome manifest, and region manifest. Finish with successful conclusion
  readiness and report the native evidence. This is the requested endpoint.
initial_environment:
  config: supplied canonical-style config prepared by the benchmark author
  inputs: existing fixed-bin behavioral fixture with synthetic identifiers
  source: /sc/arion/projects/load/users/sunh14/xqtl/xqtl-protocol
  runtime: /sc/arion/work/sunh14/conda/envs/xqtl-r-base-fsusie
  source_config_sha256: 2fefb9cfd87596a936de7b5ef1ef77fc7d1652fa06f947879f8549a460502618
authorized_effects:
  - prepare_config using the supplied baseline
  - check_readiness for the two declared manifest targets
  - initiate_run or normal resume for those same targets
  - inspect inputs, products, native logs, and notebook history
protected_semantics:
  - supplied inputs and their contents
  - chr22 scope and original sample order
  - phenotype values, identifiers, and coordinates
  - canonical scientific implementation
execution_invariants:
  - use the supplied canonical Snakefile, runtime, and LSF profile
  - retain actions and results in one operator notebook
  - preserve valid completed products on normal resume
declared_outcome:
  samples: 10000
  phenotypes: 16
  chromosomes: [chr22]
  output_subdir: data_preprocessing/SYN/phenotype_data
  manifests:
    - phenotypes.phenotype_by_chrom_files.txt
    - phenotypes.phenotype_by_chrom_files.region_list.txt
milestones:
  - configuration materialized
  - successful readiness before submission
  - canonical manifests and indexed BED produced
  - conclusion readiness reports nothing_to_do
graders:
  G1: exact BED contents, working tabix index, and manifest contents
  G2: input/source hashes, protected configuration, and retained action bindings
  G3: recorded configuration, readiness, submission, and conclusion sequence
  limitation: external unrecorded actions require separate trajectory review
reference_solution: benchmark/README.md
source_constructs: [fixed_analysis_happy_path, data_preservation, terminal_evidence]
limitations:
  - No association, fine-mapping, biological-realism, or LD-fidelity claim.
  - This development reference is not an autonomous scored agent trial.
